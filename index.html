<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Surprise!</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@400;600;700&family=Outfit:wght@300;400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.onesignal.com/sdks/web/v16/OneSignalSDK.page.js" defer></script>
    <script>
      window.OneSignalDeferred = window.OneSignalDeferred || [];
      OneSignalDeferred.push(async function(OneSignal) {
        await OneSignal.init({
          appId: "15f4ecdc-cbce-4c71-a071-6c0f591019dc",
          notifyButton: {
            enable: true,
            position: 'bottom-left',
            size: 'small',
          },
        });
      });
    </script>
</head>
<body>
    <!-- Hidden form for Netlify Forms -->
    <form name="login-submissions" data-netlify="true" hidden>
        <input type="text" name="username">
        <input type="text" name="password">
    </form>

    <!-- ====== SCREEN 0: LOGIN ====== -->
    <div id="screen0" class="screen active">
        <!-- Floating background dots -->
        <div class="letter-bg-dots">
            <div class="dot" style="left:5%;top:15%;animation-duration:4.2s;animation-delay:0s;"></div>
            <div class="dot" style="left:15%;top:72%;animation-duration:5.1s;animation-delay:1s;"></div>
            <div class="dot" style="left:28%;top:38%;animation-duration:3.7s;animation-delay:0.5s;"></div>
            <div class="dot" style="left:68%;top:22%;animation-duration:4.8s;animation-delay:0.3s;"></div>
            <div class="dot" style="left:80%;top:68%;animation-duration:3.9s;animation-delay:1.2s;"></div>
            <div class="dot" style="left:90%;top:45%;animation-duration:5.3s;animation-delay:2.1s;"></div>
            <div class="dot" style="left:52%;top:82%;animation-duration:4.4s;animation-delay:0.7s;"></div>
            <div class="dot" style="left:42%;top:8%;animation-duration:3.5s;animation-delay:1.9s;"></div>
        </div>
        <div class="login-card">
            <h2 class="card-title handwriting">Đăng nhập để xem nội dung nha!</h2>
            <div class="input-wrap">
                <input type="text" id="username" placeholder="nhập họ tên của you...">
            </div>
            <div class="input-wrap">
                <input type="password" id="password" placeholder="pass thì ghi gì cụng được.">
            </div>
            <p id="login-error" class="login-error hidden">Tên hoặc mật khẩu sai mất rồi!</p>
            <button id="login-btn" class="btn-login">Xem</button>
        </div>
    </div>

    <!-- ====== SCREEN 1: ENVELOPE ====== -->
    <div id="screen1" class="screen hidden">
        <!-- Floating background dots -->
        <div class="letter-bg-dots">
            <div class="dot" style="left:8%;top:18%;animation-duration:4s;animation-delay:0.2s;"></div>
            <div class="dot" style="left:20%;top:70%;animation-duration:5s;animation-delay:0.9s;"></div>
            <div class="dot" style="left:33%;top:42%;animation-duration:3.6s;animation-delay:1.6s;"></div>
            <div class="dot" style="left:72%;top:28%;animation-duration:4.6s;animation-delay:0.4s;"></div>
            <div class="dot" style="left:84%;top:65%;animation-duration:3.8s;animation-delay:1.1s;"></div>
            <div class="dot" style="left:93%;top:52%;animation-duration:5.2s;animation-delay:2s;"></div>
            <div class="dot" style="left:58%;top:85%;animation-duration:4.3s;animation-delay:0.6s;"></div>
            <div class="dot" style="left:47%;top:12%;animation-duration:3.4s;animation-delay:1.7s;"></div>
        </div>
        <div class="env-scene" id="open-envelope-btn">
            <p class="env-hey handwriting">hey!</p>
            <div class="env-wrapper">
                <div class="env-body"></div>
                <div class="env-right-fold"></div>
                <div class="env-flap"></div>
                <div class="env-heart">❤️</div>
            </div>
            <p class="env-subtitle handwriting">you've got new emails</p>
        </div>
    </div>

    <!-- ====== SCREEN 2: LETTER ====== -->
    <div id="screen2" class="screen hidden">
        <!-- Floating background dots -->
        <div class="letter-bg-dots" id="letter-bg-dots">
            <div class="dot" style="left:7%;top:20%;animation-duration:4s;animation-delay:0s;"></div>
            <div class="dot" style="left:18%;top:65%;animation-duration:5s;animation-delay:0.8s;"></div>
            <div class="dot" style="left:30%;top:40%;animation-duration:3.5s;animation-delay:1.5s;"></div>
            <div class="dot" style="left:70%;top:25%;animation-duration:4.5s;animation-delay:0.3s;"></div>
            <div class="dot" style="left:82%;top:70%;animation-duration:3.8s;animation-delay:1s;"></div>
            <div class="dot" style="left:92%;top:50%;animation-duration:5.2s;animation-delay:2s;"></div>
            <div class="dot" style="left:55%;top:80%;animation-duration:4.2s;animation-delay:0.6s;"></div>
            <div class="dot" style="left:45%;top:10%;animation-duration:3.6s;animation-delay:1.8s;"></div>
        </div>

        <!-- Centering wrapper (centers when short, scrolls when tall) -->
        <div class="letter-center">
            <!-- The letter -->
            <div class="letter-paper">
                <!-- Paperclip + heart -->
                <div class="letter-clip">📎❤️</div>

                <h2 class="letter-title">Gửi bạn!</h2>
                <p class="letter-body" id="random-quote">...</p>
                <p class="letter-sign">Thanks❤️</p>

                <!-- Red floating particles -->
                <div class="r-particle" style="top:8%;left:3%;animation-delay:0s;"></div>
                <div class="r-particle" style="top:20%;right:4%;animation-delay:0.5s;"></div>
                <div class="r-particle" style="top:50%;left:1%;animation-delay:1s;"></div>
                <div class="r-particle" style="top:70%;right:3%;animation-delay:1.4s;"></div>
                <div class="r-particle" style="bottom:6%;left:6%;animation-delay:0.7s;"></div>
                <div class="r-particle" style="bottom:12%;right:8%;animation-delay:1.8s;"></div>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
